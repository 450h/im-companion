name: Content error
description: A wrong or unclear fact, citation, flashcard, question or answer
labels: [content-error]
body:
  - type: markdown
    attributes:
      value: |
        The ⚑ button in the app fills in the first fields for you. Please **don't paste text or images from the textbooks**; give the book and page instead.
  - type: input
    id: content_id
    attributes:
      label: Content ID
      description: Filled in by the ⚑ button (e.g. a topic/section/question id)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: App and content version
      placeholder: app 0.2.0 / content 2026.10.28.1
  - type: dropdown
    id: kind
    attributes:
      label: What's wrong?
      options: [Wrong fact, Wrong answer key, Wrong or missing citation (page), Unclear or misleading wording, Missing blueprint objective, Typo, Other]
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What's wrong and what's right, with the book and page that supports the correction.
    validations:
      required: true
