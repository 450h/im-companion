name: Release

# Releases are built only here, from a semver v* tag (CLAUDE.md golden rule 9). No auto-updater (ADR-0008):
# the app's banner links students to this release page.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run guard:copyright
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run dist
      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem dist -File -Filter *.exe | ForEach-Object { $_.FullName }) + 'dist/SHA256SUMS.txt'
          $notes = if (Test-Path RELEASE_NOTES.md) { Get-Content RELEASE_NOTES.md -Raw } else { '' }
          gh release create "${{ github.ref_name }}" @files --title "MED 222 IM Companion ${{ github.ref_name }}" --notes "$notes" --generate-notes
